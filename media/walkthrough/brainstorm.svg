<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Two agents answer, then agree on one answer"><style>text{font-family:var(--vscode-font-family);font-size:14px}.fg{fill:var(--vscode-foreground)}.dim{fill:var(--vscode-descriptionForeground)}.accent{fill:var(--vscode-textLink-foreground)}.card{fill:var(--vscode-editor-background);stroke:var(--vscode-widget-border,var(--vscode-editorWidget-border))}.chip{fill:var(--vscode-editorWidget-background,var(--vscode-editor-background));stroke:var(--vscode-widget-border,var(--vscode-editorWidget-border))}.sel{fill:var(--vscode-button-background)}.selfg{fill:var(--vscode-button-foreground)}.hl{fill:var(--vscode-list-activeSelectionBackground)}.hlfg{fill:var(--vscode-list-activeSelectionForeground,var(--vscode-foreground))}.ok{fill:var(--vscode-charts-green)}.line{stroke:var(--vscode-descriptionForeground);fill:none;stroke-width:1.5}</style>
<rect class="card" x="40" y="36" width="190" height="84" rx="8"/><text class="fg" x="56" y="64" style="font-weight:600">Claude Code</text><text class="dim" x="56" y="90" style="font-size:12px">Cache the token lookups</text><text class="dim" x="56" y="106" style="font-size:12px">per request.</text>
<rect class="card" x="250" y="36" width="190" height="84" rx="8"/><text class="fg" x="266" y="64" style="font-weight:600">Codex</text><text class="dim" x="266" y="90" style="font-size:12px">A per-request cache hides</text><text class="dim" x="266" y="106" style="font-size:12px">stale revocations.</text>
<path class="line" d="M135 124 L135 150 L240 150 L240 172 M345 124 L345 150 L240 150"/><path class="line" d="M233 166 L240 174 L247 166"/>
<rect class="hl" x="40" y="182" width="400" height="80" rx="8"/><text class="hlfg" x="56" y="210" style="font-weight:600">One answer</text><text class="hlfg" x="56" y="238" style="font-size:12px">Cache per request, but check revocation on every write.</text>
</svg>
