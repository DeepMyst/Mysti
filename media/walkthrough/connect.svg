<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Connect an agent: Claude Code ready, Codex needs sign-in, or the Mysti agent with nothing to install"><style>text{font-family:var(--vscode-font-family);font-size:14px}.fg{fill:var(--vscode-foreground)}.dim{fill:var(--vscode-descriptionForeground)}.accent{fill:var(--vscode-textLink-foreground)}.card{fill:var(--vscode-editor-background);stroke:var(--vscode-widget-border,var(--vscode-editorWidget-border))}.chip{fill:var(--vscode-editorWidget-background,var(--vscode-editor-background));stroke:var(--vscode-widget-border,var(--vscode-editorWidget-border))}.sel{fill:var(--vscode-button-background)}.selfg{fill:var(--vscode-button-foreground)}.hl{fill:var(--vscode-list-activeSelectionBackground)}.hlfg{fill:var(--vscode-list-activeSelectionForeground,var(--vscode-foreground))}.ok{fill:var(--vscode-charts-green)}.line{stroke:var(--vscode-descriptionForeground);fill:none;stroke-width:1.5}</style>
<rect class="card" x="60" y="30" width="360" height="240" rx="10"/>
<text class="fg" x="84" y="66" style="font-size:16px;font-weight:600">Connect an agent</text>
<rect class="chip" x="84" y="84" width="312" height="48" rx="6"/><text class="fg" x="100" y="113">Claude Code</text><circle class="ok" cx="318" cy="108" r="4"/><text class="dim" x="330" y="113">Ready</text>
<rect class="chip" x="84" y="142" width="312" height="48" rx="6"/><text class="fg" x="100" y="171">OpenAI Codex</text><rect class="sel" x="316" y="152" width="66" height="28" rx="4"/><text class="selfg" x="349" y="171" text-anchor="middle" style="font-size:12px">Sign in</text>
<rect class="chip" x="84" y="200" width="312" height="48" rx="6"/><text class="fg" x="100" y="229">Mysti agent</text><text class="dim" x="382" y="229" text-anchor="end" style="font-size:12px">Free · nothing to install</text>
</svg>
