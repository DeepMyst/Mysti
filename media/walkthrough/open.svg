<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Press Command Shift M to open Mysti"><style>text{font-family:var(--vscode-font-family);font-size:14px}.fg{fill:var(--vscode-foreground)}.dim{fill:var(--vscode-descriptionForeground)}.accent{fill:var(--vscode-textLink-foreground)}.card{fill:var(--vscode-editor-background);stroke:var(--vscode-widget-border,var(--vscode-editorWidget-border))}.chip{fill:var(--vscode-editorWidget-background,var(--vscode-editor-background));stroke:var(--vscode-widget-border,var(--vscode-editorWidget-border))}.sel{fill:var(--vscode-button-background)}.selfg{fill:var(--vscode-button-foreground)}.hl{fill:var(--vscode-list-activeSelectionBackground)}.hlfg{fill:var(--vscode-list-activeSelectionForeground,var(--vscode-foreground))}.ok{fill:var(--vscode-charts-green)}.line{stroke:var(--vscode-descriptionForeground);fill:none;stroke-width:1.5}</style>
