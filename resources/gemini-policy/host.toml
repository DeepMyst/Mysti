# A bounded file-tool surface for Gemini CLI 0.58.0 and 0.60.0. Neither sends
# full shell inputs through ACP, so native shell/delegation remains denied.
[[rule]]
toolName = "*"
decision = "deny"
priority = 998

[[rule]]
toolName = ["read_file", "write_file", "replace"]
decision = "ask_user"
priority = 999
