# Dependabot.
#
# Grouped and monthly on purpose. This repo has one maintainer; a daily stream
# of single-package PRs gets muted, and a muted bot is worse than none.
#
# Security advisories are NOT affected by the schedule below — Dependabot opens
# those as soon as they land, including advisories in transitive runtime
# dependencies. Vendored assets must be rebuilt when their locked inputs change.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Toolchain moves together or not at all — a lone webpack or ts-loader
      # bump usually just fails against its siblings.
      build-toolchain:
        patterns:
          - webpack*
          - ts-loader
          - typescript
          - "@types/*"
      lint-and-test:
        patterns:
          - eslint
          - "@typescript-eslint/*"
          - vitest
          - "@vscode/test-*"
          - mocha
          - "@types/mocha"
      runtime:
        patterns:
          - "*"
        exclude-patterns:
          - webpack*
          - ts-loader
          - typescript
          - "@types/*"
          - eslint
          - "@typescript-eslint/*"
          - vitest
          - "@vscode/test-*"
          - mocha
    ignore:
      # ts-loader and typescript-eslint still consume the JavaScript compiler API.
      # Revisit when both support the TypeScript 7 programmatic API.
      - dependency-name: typescript
        versions: [">=6"]
      # Mocha executes INSIDE VS Code 1.86 (Node 18.17.1), not development Node.
      - dependency-name: mocha
        versions: [">=11"]
      # Declarations follow development Node 22, not the newest Node runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # These declarations describe the oldest supported editor, not the newest
      # development toolchain. Raise them with engines.vscode and the host matrix.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Releases after 1.58 require Node 20; the VS Code 1.86 host is Node 18.17.1.
      # `playwright` is a webpack external and its browser binaries are NOT
      # shipped; the user installs them separately with `npx playwright install
      # chromium`. A major bump can change the driver protocol out from under an
      # already-installed browser, so majors are taken deliberately, not by bot.
      - dependency-name: playwright
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
