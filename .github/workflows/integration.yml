name: integration

on:
  # Run the exact pushed candidate as well as GitHub's PR merge commit.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vscode:
    name: VS Code host (${{ matrix.os }}, ${{ matrix.version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [stable]
        include:
          # Exercise the oldest host allowed by engines.vscode as well as stable.
          - os: ubuntu-latest
            version: '1.86.0'
    env:
      MYSTI_TEST_VSCODE_VERSION: ${{ matrix.version }}
      MYSTI_TEST_VSIX_PATH: ${{ github.workspace }}/mysti-desk.vsix
      MYSTI_TEST_DESK_NATIVE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Build and install the actual host's native archive. The minimum Linux
      # editor gets the same native payload and must refuse it before loading.
      - name: Package Desk for this platform
        run: npm run package:desk -- --out mysti-desk.vsix
      - name: Check the exact platform archive
        run: npm run check:package -- mysti-desk.vsix
      - name: Prepare editor tests
        run: |
          npm run typecheck:editor
          node scripts/prepare-vscode-fixture.js

      - name: Test (Linux — needs a display server)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/run-editor-tests.mjs

      - name: Test (macOS / Windows)
        if: runner.os != 'Linux'
        run: node scripts/run-editor-tests.mjs

      - name: Upload accepted Desk platform archive
        uses: actions/upload-artifact@v4
        with:
          name: mysti-desk-${{ matrix.os }}-${{ matrix.version }}
          path: mysti-desk.vsix
          if-no-files-found: error
