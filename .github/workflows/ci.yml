name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Provider-literal guard
        run: npm run lint:provider-literals
      - name: Vendored assets match locked dependencies
        run: npm run check:vendor
      # Release builds verify the committed integrity manifest before webpack;
      # the development compile command regenerates it instead.
      - name: Compile
        run: npm run compile:release

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Fail at collection if Chromium is missing; run each browser suite once.
      MYSTI_REQUIRE_CHROMIUM: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium for the browser suites
        run: npm exec --no -- playwright install --with-deps chromium
      - name: Test
        run: npm test -- --maxWorkers 2 --exclude tests/webview/canvasPerfBrowser.test.ts
      # Frame-time comparisons need the runner's browser capacity to themselves.
      # Keep the original assertions blocking, outside concurrent browser suites.
      - name: Canvas performance
        run: npm test -- tests/webview/canvasPerfBrowser.test.ts

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint

  minimum-runtime:
    name: bundled runtime (Node 18.17.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked build toolchain
        run: npm ci
      - name: Build runtime compatibility fixture
        run: node scripts/build-runtime-fixture.js
      # VS Code 1.86.0 embeds Node 18.17.1. This checks bundled runtime paths;
      # the separate VS Code integration workflow exercises the editor UI.
      - uses: actions/setup-node@v4
        with:
          node-version: '18.17.1'
      - name: Verify editor runner on the minimum Node runtime
        run: node scripts/check-editor-runner.cjs
      - name: Exercise the minimum supported runtime
        run: node out-test/runtime/minimum.cjs

  package-shape:
    name: package shape
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [gates, test, lint, minimum-runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      # Use the lockfile-pinned packager and dependency flag from package.json.
      - name: Package
        run: npm run package -- --out mysti-ci.vsix
      - name: Check package shape
        run: npm run check:package -- mysti-ci.vsix
      - name: Upload verified VSIX
        uses: actions/upload-artifact@v4
        with:
          name: mysti-vsix
          path: mysti-ci.vsix
          if-no-files-found: error

  packaged-vscode:
    name: packaged VS Code (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [package-shape]
    strategy:
      fail-fast: false
      matrix:
        # The installed archive must work on the minimum supported editor as
        # well as stable. Neither host failure is advisory or retried.
        version: ['1.86.0', stable]
    env:
      MYSTI_TEST_VSCODE_VERSION: ${{ matrix.version }}
      MYSTI_TEST_VSIX_PATH: ${{ github.workspace }}/mysti-ci.vsix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install test tooling
        run: npm ci
      - name: Download the verified archive
        uses: actions/download-artifact@v4
        with:
          name: mysti-vsix
          path: ${{ github.workspace }}
      # Only compile the integration driver; packaging already built the exact
      # extension under test. Do not rebuild it from this checkout.
      - name: Prepare editor tests
        run: |
          npm run typecheck:editor
          node scripts/prepare-vscode-fixture.js
      - name: Test installed extension
        env:
          TMPDIR: ${{ runner.temp }}
        run: xvfb-run -a node scripts/run-editor-tests.mjs
      - name: Upload Canvas screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-canvas-${{ matrix.version }}
          path: ${{ runner.temp }}/mysti-vscode-*/canvas-*.png
          if-no-files-found: ignore
