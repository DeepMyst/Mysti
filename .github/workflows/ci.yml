name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Provider-literal guard
        run: npm run lint:provider-literals
      - name: Vendored assets match locked dependencies
        run: npm run check:vendor
      # Release builds verify the committed integrity manifest before webpack;
      # the development compile command regenerates it instead.
      - name: Compile
        run: npm run compile:release

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Fail at collection if Chromium is missing; run each browser suite once.
      MYSTI_REQUIRE_CHROMIUM: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium for the browser suites
        run: npm exec --no -- playwright install --with-deps chromium
      - name: Test
        run: npm test

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint

  minimum-runtime:
    name: bundled runtime (Node 18.17.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked build toolchain
        run: npm ci
      - name: Build runtime compatibility fixture
        run: node scripts/build-runtime-fixture.js
      # VS Code 1.86.0 embeds Node 18.17.1. This checks bundled runtime paths;
      # the separate VS Code integration workflow exercises the editor UI.
      - uses: actions/setup-node@v4
        with:
          node-version: '18.17.1'
      - name: Exercise the minimum supported runtime
        run: node out-test/runtime/minimum.cjs

  package-shape:
    name: package shape
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [gates, test, lint, minimum-runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      # Use the lockfile-pinned packager and dependency flag from package.json.
      - name: Package
        run: npm run package -- --out mysti-ci.vsix
      - name: Check package shape
        run: npm run check:package -- mysti-ci.vsix
      - name: Upload verified VSIX
        uses: actions/upload-artifact@v4
        with:
          name: mysti-vsix
          path: mysti-ci.vsix
          if-no-files-found: error
